    </div>

    <div className="perf"></div>
    <p className="eyebrow mut">${C.footer}</p>
    ${guest&&h`<p style=${{marginTop:14,fontSize:'.85rem'}}>Dear <b>${guest}</b></p>`}
    <button className="btn" style=${{marginTop:16}} onClick=${onOpen}>BUKA UNDANGAN</button>
  </div></div></header>`;
}
function Opening(){return h`<${Reveal} id="opening"><p style=${{marginBottom:40}} className="lead">Segala sesuatu Kami ciptakan berpasang-pasangan agar kamu mengingat (kebesaran Allah). (QS Az Zariyat : 49)</p><${Head}>${D.openingGreeting}<//><p className="lead">${D.invitationMessage}</p>
  <div style=${{marginTop:28}}><${Photo} src=${D.couplePhoto} alt=${`${names[0].nickname} and ${names[1].nickname}`} ratio="3/2" label=${`${names[0].nickname} & ${names[1].nickname}`}/></div><//>`}
function Count(){
  const [n,setN]=useState(Date.now());
  useEffect(()=>{const t=setInterval(()=>setN(Date.now()),1000);return()=>clearInterval(t)},[]);
  const s=Math.max(0,Math.floor((new Date(E.start)-n)/1e3));
  const v=[[Math.floor(s/86400),'Hari'],[Math.floor(s%86400/3600),'Jam'],[Math.floor(s%3600/60),'Menit'],[s%60,'Detik']];
  return h`<div className="cd" role="timer" aria-label="Countdown to the wedding">${v.map(([a,l])=>h`<div key=${l}><b>${pad(a)}</b><small>${l}</small></div>`)}</div>`;
}
function Calendar(){
  const dayNames = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];

  const lead=(new Date(Date.UTC(Y,M-1,1)).getUTCDay()+6)%7,n=new Date(Date.UTC(Y,M,0)).getUTCDate();

  const cells=[...Array(lead).fill(null),...Array.from({length:n},(_,i)=>i+1)];

  const mon=new Intl.DateTimeFormat('id-ID',{
    timeZone:'UTC',
    month:'long',
    year:'numeric'
  }).format(new Date(Date.UTC(Y,M-1,1)));

  return h`
    <${Reveal} id="date" kind="flip">
      <${Head}>KAMI MENANTIKAN KEHADIRAN ANDA<//>

      <p className="lead">
        Mari hadir dan bergabung bersama kami merayakan hari yang penuh cinta, tawa, dan kenangan tak terlupakan.
      </p>

      <div className="cdcard">
        <h3 className="t" style=${{fontSize:'1.3rem'}}>${mon}</h3>

        <div className="cal" role="img" aria-label=${dateLong}>
          ${dayNames.map((c,i)=>h`<i key=${'h'+i}>${c}</i>`)}
          ${cells.map((c,i)=>h`<span key=${i} className=${c===DAY?'hl':''}>${c}</span>`)}
        </div>

        <p className="eyebrow mut" style=${{borderTop:'1.5px dashed #EDE0CA',paddingTop:14}}>
          Save the date
        </p>

        <p className="t" style=${{fontSize:'1.8rem',margin:'4px 0 12px'}}>
          ${dmy}
        </p>

        <${Count}/>
      </div>
    <//>
  `;
}
function Story(){return !D.loveStory?.length?null:h`<${Reveal} id="story"><${Head}>KISAH KAMI<//><ul className="story">${D.loveStory.map((x,i)=>h`<li key=${i}><small className="eyebrow">${x.date}</small><b>${x.title}</b><span>${x.text}</span></li>`)}</ul><//>`}
function Pax({p,role,rel}){
  return h`<div className="ticket pax"><div className="av">${safeImg(p.photo)?h`<${Photo} src=${p.photo} alt=${p.fullName} ratio="1"/>`:h`<${Globe} s=${64}/>`}</div>
  <div style=${{flex:1}}><small className="eyebrow mut" style=${{fontSize:'.58rem'}}>${role}</small><h3>${p.fullName}</h3><p className="mut" style=${{fontSize:'.85rem'}}>${rel}</p><p style=${{fontWeight:500,fontSize:'.85rem'}}>${p.parents}</p></div><div className="bar" aria-hidden="true"></div></div>`;
}
function Couple(){return h`<${Reveal} id="couple"><${Head}>PARA PENUMPANG<//><p className="lead">Dua penumpang, satu tujuan: selamanya.</p>
  <div style=${{marginTop:24}}><${Pax} p=${B} role="PENUMPANG 01 · MEMPELAI WANITA" rel="Putri dari"/><div className="amp" aria-hidden="true">&</div><${Pax} p=${G} role="PENUMPANG 02 · MEMPELAI PRIA" rel="Putra dari"/></div><//>`}
function Venue(){
  const S=D.sessions||[];
  return !S.length?null:h`<${Reveal} id="venue" kind="flip"><div className="ticket ev"><h2 className="t">LOKASI ACARA</h2><div className="rule"></div>
  ${S.map((s,i)=>h`<div key=${i} style=${i?{borderTop:'1.5px dashed #1c223080',paddingTop:20,marginTop:20}:{}}><h3>${s.title}</h3><p className="mut" style=${{marginTop:6}}>${dateLong} · ${s.time}</p><p className="v">${s.venue}</p><p className="mut" style=${{fontSize:'.78rem',textTransform:'uppercase',letterSpacing:'.08em'}}>${s.address}</p>
  ${safeLink(s.mapsUrl)&&h`<a className="btn" href=${safeLink(s.mapsUrl)} target="_blank" rel="noopener noreferrer">LIHAT LOKASI</a>`}</div>`)}</div><//>`;
}
function Dress(){const c=D.dressCode;return !c?null:h`<${Reveal} id="dress"><${Head}>Dress Code<//><p className="lead">${c.text}</p><div className="sw">${(c.colors||[]).map(x=>h`<div key=${x.name}><span style=${{background:/^#[0-9a-f]{3,8}$/i.test(x.hex)?x.hex:'#999'}}></span>${x.name}</div>`)}</div><//>`}
function Gallery(){
  const items=D.gallery||[],[i,setI]=useState(-1);
  useEffect(()=>{if(i<0)return;const k=e=>{if(e.key==='Escape')setI(-1);if(e.key==='ArrowRight')setI(x=>(x+1)%items.length);if(e.key==='ArrowLeft')setI(x=>(x+items.length-1)%items.length)};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[i]);
  if(!items.length)return null;
  return h`<${Reveal} id="gallery"><${Head}>CATATAN PERJALANAN<//><p className="lead">Sekilas kisah perjalanan kami sebelum melangkah bersama.</p>
  <div className="gal">${items.map((g,k)=>h`<button key=${k} onClick=${()=>setI(k)} aria-label=${'Open photo: '+g.alt}><${Photo} src=${g.src} alt=${g.alt} ratio=${k%3===0?'16/10':'3/4'} label=${g.alt}/></button>`)}</div>
  ${i>=0&&h`<div className="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" onClick=${()=>setI(-1)}><button className="x" aria-label="Close" onClick=${()=>setI(-1)}>✕</button><button className="p" aria-label="Previous" onClick=${e=>{e.stopPropagation();setI((i+items.length-1)%items.length)}}>‹</button><div className="in" onClick=${e=>e.stopPropagation()}><${Photo} src=${items[i].src} alt=${items[i].alt} ratio="4/3" label=${items[i].alt}/></div><button className="n" aria-label="Next" onClick=${e=>{e.stopPropagation();setI((i+1)%items.length)}}>›</button></div>`}<//>`;
}
function Rsvp(){
  const R=D.rsvp,key='inv-rsvp-'+D.id,empty={name:'',phone:'',org:'',resp:''};
  const [f,setF]=useState(empty),[st,setSt]=useState(''),[loading,setLoading]=useState(false);
  const up=k=>e=>setF({...f,[k]:e.target.value});

  const sub=async e=>{
    e.preventDefault();
    if(loading) return;
    if(!f.name.trim()||!f.resp) return setSt('Silakan masukkan nama Anda & pilih konfirmasi.');
    if(f.phone&&!/^\+?\d{8,15}$/.test(f.phone.replace(/[\s-]/g,''))) return setSt('Tolong cek nomor WhatsApp yang dimasukkan.');

    setLoading(true);
    setSt('Mengirim konfirmasi...');
    const rec={type:'rsvp',...f,at:new Date().toISOString()};
    ls.set(key,[...(ls.get(key)||[]),rec]);

    try{
      if(safeLink(R.endpoint)){
        await fetch(R.endpoint,{
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify(rec)
        });
      }
      setSt(f.resp==='yes'?'Terima kasih! Sampai jumpa di Acara ✈':'Terima kasih telah memberi tahu kami.');
      setF(empty);
    }catch(_){
      setSt('Gagal mengirim saat ini. Silakan coba lagi.');
    }finally{
      setLoading(false);
    }
  };

  return h`<${Reveal} id="rsvp" kind="flip"><form className="ticket" onSubmit=${sub} noValidate>
    <p className="eyebrow mut" style=${{display:'flex',justifyContent:'space-between'}}><span>TIKET KEBERANGKATAN</span><${Plane} s=${16}/><span>GERBANG · CINTA</span></p><div className="perf" style=${{margin:'10px 0'}}></div>
    <h2 className="t" style=${{fontSize:'2.4rem'}}>RSVP</h2><p className="lead mut" style=${{fontSize:'.88rem'}}>Mohon konfirmasi kehadiran Anda paling lambat satu minggu sebelum keberangkatan.</p>
    <label><span className="sr" hidden>Full name</span><input className="fld" placeholder="Nama lengkap Anda" value=${f.name} onChange=${up('name')} maxLength="80" autoComplete="name" required/></label>
    <input className="fld" aria-label="Nomor WhatsApp" placeholder="Nomor WhatsApp contoh: 6289666613131" inputMode="tel" value=${f.phone} onChange=${up('phone')} maxLength="20" autoComplete="tel"/>
    <input className="fld" aria-label="Address or company" placeholder="Alamat / Instansi" value=${f.org} onChange=${up('org')} maxLength="100"/>
    <fieldset style=${{border:0,padding:0,margin:'18px 0 4px',textAlign:'left'}}><legend style=${{fontSize:'.9rem'}}>Konfirmasi Anda</legend>
      ${[['yes',"Ya, saya akan hadir"],['no',"Maaf, saya berhalangan hadir"]].map(([v,t])=>h`<label className="rad" key=${v}><input type="radio" name="resp" value=${v} checked=${f.resp===v} onChange=${up('resp')}/>${t}</label>`)}</fieldset>
    <button className="btn" style=${{width:'100%'}} type="submit" disabled=${loading}>${loading ? 'MENGIRIM...' : 'KIRIM KONFIRMASI'}</button>
    <p className="msg" role="status" aria-live="polite">${st}</p><div className="perf"></div><p className="eyebrow mut">SAMPAI JUMPA DI ACARA</p></form><//>`;
}
function Gift(){
  const[o,setO]=useState(false),[c,setC]=useState('');
  const cp=async a=>{try{await navigator.clipboard.writeText(a.number)}catch(e){const t=document.createElement('textarea');t.value=a.number;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove()}setC(a.number);setTimeout(()=>setC(''),2000)};
  return h`<${Reveal} id="gift"><div className="ticket" style=${{maxWidth:360,margin:'0 auto'}}><h2 className="t" style=${{fontSize:'1.7rem'}}>KADO PERNIKAHAN</h2><div className="rule"></div><p className="mut" style=${{fontSize:'.88rem'}}>${D.gift.text}</p>
  <button className="btn" style=${{marginTop:14}} aria-expanded=${o} onClick=${()=>setO(!o)}>${o?'SEMBUNYIKAN':'KIRIM TANDA KASIH'}</button>
  ${o&&h`
    <div style=${{marginTop:10}}>
      <button className="btn" onClick=${()=>window.open('https://www.myregistry.com/giftlist/giftshaemita','_blank','noopener,noreferrer')}>KADO YANG KAMI INGINKAN</button>
    </div>
    ${(D.gift.accounts||[]).map(a=>h`<div className="acc" key=${a.number}><span>${a.bank} · ${a.name}</span><b>${a.number}</b><button className="btn" onClick=${()=>cp(a)}>${c===a.number?'Tersalin ✓':'SALIN REKENING'}</button></div>`)}
  `}</div><//>`;
}
function Wishes(){
  const endpoint = D.rsvp.endpoint; // Menggunakan URL Web App yang sama
  const [list,setList]=useState(()=>D.wishes||[]);
  const [n,setN]=useState(''),[t,setT]=useState(''),[loading,setLoading]=useState(false);

  // Ambil data ucapan dari Google Sheets saat halaman pertama kali dibuka
  useEffect(()=>{
    if(!safeLink(endpoint)) return;
    fetch(endpoint)
      .then(r=>r.json())
      .then(data=>{
        if(Array.isArray(data)){
          // Gabungkan data dari Google Sheet + data bawaan D.wishes
          setList([...data, ...(D.wishes||[])]);
        }
      })
      .catch(err=>console.error('Gagal memuat ucapan:', err));
  },[]);

  const sub=async e=>{
    e.preventDefault();
    if(!n.trim()||!t.trim()||loading) return;

    const newWish={name:n.trim(),from:'',text:t.trim()};
    
    // 1. Langsung tampilkan di bawah form seketika (Optimistic UI)
    setList([newWish, ...list]);
    setN('');
    setT('');
    setLoading(true);

    // 2. Simpan ke Google Sheets di background
    try{
      if(safeLink(endpoint)){
        await fetch(endpoint,{
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({type:'wish', ...newWish})
        });
      }
    }catch(err){
      console.error('Gagal menyimpan ucapan ke Sheet:', err);
    }finally{
      setLoading(false);
    }
  };

  return h`<${Reveal} id="wishes"><div className="ticket" style=${{padding:'40px 20px'}}><h2 className="t">UCAPAN & DOA</h2><div className="rule"></div><p className="mut" style=${{fontSize:'.9rem'}}>Titipkan doa dan harapan terbaik untuk perjalanan baru kami.</p>
  <form onSubmit=${sub} style=${{marginTop:12}}>
    <input className="fld" aria-label="Nama Anda" placeholder="Nama Anda" maxLength="60" value=${n} onChange=${e=>setN(e.target.value)} required/>
    <textarea className="fld" aria-label="Ucapan & doa Anda" placeholder="Ucapan & doa Anda" rows="2" maxLength="240" value=${t} onChange=${e=>setT(e.target.value)} required></textarea>
    <button className="btn" style=${{marginTop:14}} type="submit" disabled=${loading}>${loading ? 'MENGIRIM...' : 'KIRIM UCAPAN'}</button>
  </form>
  <div className="wl">${list.map((w,i)=>h`<article key=${i}><b>${w.name}</b>${w.from&&h`<small className="nama"> · ${w.from}</small>`}<p>“${w.text}”</p></article>`)}</div></div><//>`;
}
function Closing(){return h`<${Reveal} id="closing"><${Photo} src=${D.couplePhoto} alt="Couple" ratio="1" label="Your photo"/>
  <p className="script" style=${{fontSize:'3rem',textAlign:'center',marginTop:18}}>Terima kasih</p><h2 className="t" style=${{fontSize:'1.6rem'}}>${names[0].nickname} & ${names[1].nickname}</h2>
  <p className="eyebrow" style=${{textAlign:'center',margin:'14px 0'}}>TUJUAN YANG TAK TERLUPAKAN</p><p className="lead">${D.closingMessage}</p><//>`}

/* ---------- app ---------- */
function App(){
  const [open,setOpen]=useState(false),[play,setPlay]=useState(false),[top,setTop]=useState(false);
  const au=useRef(null),guest=useMemo(()=>(new URLSearchParams(location.search).get('to')||'').slice(0,60),[]);
  const src=safeImg(D.music&&D.music.src)||(/^https?:\/\//i.test(D.music?.src||'')?D.music.src:'');
  useEffect(()=>{document.documentElement.style.overflow=open?'':'hidden'},[open]);
  useEffect(()=>{const f=()=>setTop(scrollY>700);addEventListener('scroll',f,{passive:true});return()=>removeEventListener('scroll',f)},[]);
  const go=id=>{const el=document.getElementById(id);el&&el.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})};
  const toggle=()=>{const a=au.current;if(!a)return;if(a.paused){a.play().then(()=>setPlay(true)).catch(()=>{})}else{a.pause();setPlay(false)}};
  const start=()=>{setOpen(true);if(src&&au.current)au.current.play().then(()=>setPlay(true)).catch(()=>{});setTimeout(()=>go('opening'),80)};
  const nav=[['opening','BERANDA'],['couple','MEMPELAI'],['venue','ACARA',(D.sessions||[]).length],['rsvp','RSVP',D.rsvp&&D.rsvp.enabled],['wishes','UCAPAN']].filter(x=>x[2]===undefined||x[2]);
  return h`<div>
    ${src&&h`<audio ref=${au} src=${src} loop preload="none"></audio>`}
    <${Cover} onOpen=${start} guest=${guest}/>
    ${open&&h`<main>
      <${Opening}/><${Calendar}/><${Story}/><${Couple}/><${Venue}/><${Dress}/>
      ${D.rsvp&&D.rsvp.enabled&&h`<${Rsvp}/>`}${D.gift&&D.gift.enabled&&h`<${Gift}/>`}<${Wishes}/><${Closing}/>
      <footer>Dibuat dengan cinta · ${names[0].nickname} & ${names[1].nickname}</footer></main>
      <nav className="nav" aria-label="Sections">${nav.map(([id,l])=>h`<button key=${id} onClick=${()=>go(id)}>${l}</button>`)}</nav>
      ${top&&h`<button className="fab up" aria-label="Back to top" onClick=${()=>scrollTo({top:0,behavior:RM?'auto':'smooth'})}>↑</button>`}
      ${src&&h`<button className=${'fab mus '+(play?'spin':'')} aria-label=${play?'Pause music':'Play music'} aria-pressed=${play} onClick=${toggle}><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${play?h`<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>`:h`<path d="M8 5v14l11-7z"/>`}</svg></button>`}`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script>
</body>
</html>
